# netsentry configuration. Every option is optional; the values shown are the defaults.
# After editing:  sudo systemctl restart netsentry

[general]
# DEBUG logs a line for every scan; INFO logs only events and errors.
log_level = INFO
# Lowest event severity that triggers a notification: info, warning or critical.
#   critical: IP conflicts / ARP spoofing, gateway MAC changes
#   warning:  new devices, unapproved devices coming back, the first-run baseline
#   info:     devices going on/offline and IP changes (logged, normally not pushed)
min_severity = warning

[scan]
# Interface to watch. Empty = the interface that holds the default route.
interface =
# Subnet to sweep, e.g. 192.168.1.0/24. Empty = the interface's own subnet.
subnet =
# Seconds between scans.
interval = 60
# Seconds to wait for late replies after the last ARP request.
timeout = 2.0
# ARP requests per address per scan (2 catches devices that miss the first one).
passes = 2
# Safety limit: refuse to sweep subnets with more hosts than this.
max_hosts = 4096
# Look up reverse-DNS names for new devices (your router usually knows DHCP hostnames).
resolve_hostnames = yes

[detection]
# Seconds without a reply before a device counts as offline. Phones sleep a lot; keep this generous.
offline_after = 600
# On the very first scan, record everything present as trusted and send one summary
# instead of an alert per device. Set to no if you don't trust your network right now.
baseline_on_first_run = yes
# Alert again each time an unapproved device comes back after being offline.
alert_on_unknown_return = yes
# Alert when one IP is answered by several MACs (ARP spoofing or an IP conflict).
conflict_alerts = yes
# Alert when the gateway's MAC address changes (classic man-in-the-middle sign).
watch_gateway = yes

[storage]
database = /var/lib/netsentry/devices.db
# JSON-lines copy of every event; leave empty to disable.
event_log = /var/log/netsentry/events.jsonl
keep_events_days = 180
# MAC vendor database. Empty = first found of ieee-data, arp-scan, nmap or wireshark files.
oui_file =

# ---------------------------------------------------------------------------
# Notification channels. Configure any number of them; leave a section's
# url/host empty to disable it. Test with:  sudo netsentry test-notify
# ---------------------------------------------------------------------------

[ntfy]
# Phone push notifications via https://ntfy.sh (or a self-hosted ntfy server).
# Install the ntfy app, subscribe to a long random topic name, and put it here.
# Anyone who knows the topic can read it, so make it hard to guess or use a token.
url =
# url = https://ntfy.sh/<your-long-random-topic>
token =

[webhook]
# Slack/Discord incoming webhook URL, or any endpoint that accepts a JSON POST.
url =
# generic, slack or discord
format = generic

[email]
host =
# 587 with starttls, 465 with ssl
port = 587
security = starttls
username =
password =
sender =
# Comma-separated list
recipients =
